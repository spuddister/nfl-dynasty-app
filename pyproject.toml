[project]
name = "fantasy-ai"
version = "0.1.0"
description = "Agentic dynasty fantasy football assistant powered by Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "praw>=7.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fantasy = "fantasy_ai.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasy_ai"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
